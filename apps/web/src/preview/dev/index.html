<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ReelForge preview harness</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          13px/1.4 system-ui,
          sans-serif;
        background: #111;
        color: #ddd;
      }
      body {
        margin: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        height: 100dvh;
      }
      @media (max-width: 760px) {
        body {
          grid-template-columns: 1fr;
          grid-template-rows: 60dvh auto;
          height: auto;
        }
      }
      #stage {
        position: relative;
        min-height: 0;
        padding: 12px;
      }
      #view {
        width: 100%;
        height: 100%;
        display: block;
        background: #000;
      }
      #stats {
        position: absolute;
        left: 20px;
        top: 20px;
        margin: 0;
        padding: 6px 8px;
        background: rgb(0 0 0 / 0.65);
        font:
          11px/1.35 ui-monospace,
          monospace;
        pointer-events: none;
        white-space: pre;
        z-index: 2;
      }
      aside {
        padding: 12px 16px;
        overflow: auto;
        border-left: 1px solid #333;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      fieldset {
        border: 1px solid #333;
        border-radius: 6px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      button,
      select {
        font: inherit;
      }
      #seek {
        width: 100%;
      }
      #snap {
        max-width: 100%;
        border: 1px solid #333;
      }
      #log {
        font:
          11px/1.3 ui-monospace,
          monospace;
        color: #f88;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="view"></canvas>
      <pre id="stats"></pre>
    </div>
    <aside>
      <fieldset>
        <legend>Project</legend>
        <button id="demo" type="button">Load demo media</button>
        <label
          >Media files <input id="media" type="file" multiple accept="video/*,image/*,audio/*"
        /></label>
        <label>Project JSON <input id="json" type="file" accept="application/json,.json" /></label>
        <label
          >Fonts <input id="fonts" type="file" multiple accept=".ttf,.otf,.woff,.woff2"
        /></label>
      </fieldset>
      <fieldset>
        <legend>Transport</legend>
        <button id="play" type="button">Play</button>
        <button id="step-back" type="button" title="Previous frame">◀|</button>
        <button id="step-fwd" type="button" title="Next frame">|▶</button>
        <span id="time">0:00.00</span>
        <input id="seek" type="range" min="0" max="1000" value="0" step="1" />
      </fieldset>
      <fieldset>
        <legend>Render</legend>
        <label
          >Quality
          <select id="quality">
            <option>auto</option>
            <option>high</option>
            <option>low</option>
          </select></label
        >
        <label
          >Decoder (reload)
          <select id="decoder">
            <option>auto</option>
            <option>webcodecs</option>
            <option>element</option>
          </select></label
        >
        <button id="snapshot" type="button">Snapshot</button>
      </fieldset>
      <img id="snap" alt="" hidden />
      <div id="log"></div>
    </aside>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
