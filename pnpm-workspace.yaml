packages:
  - apps/*
  - packages/*

minimumReleaseAgeExclude:
  - '@oxlint-tsgolint/darwin-arm64@7.0.2006'
  - '@oxlint-tsgolint/darwin-x64@7.0.2006'
  - '@oxlint-tsgolint/linux-arm64@7.0.2006'
  - '@oxlint-tsgolint/linux-x64@7.0.2006'
  - '@oxlint-tsgolint/win32-arm64@7.0.2006'
  - '@oxlint-tsgolint/win32-x64@7.0.2006'
  - oxlint-tsgolint@7.0.2006

# pnpm 12 build-script policy: onnxruntime-node fetches/links its native runtime;
# lfa-ponyfill's postinstall only refreshes a font list over the network (not needed).
allowBuilds:
  onnxruntime-node: true
  lfa-ponyfill: false

engineStrict: true
autoInstallPeers: true
